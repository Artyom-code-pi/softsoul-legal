name: Publish latest Android build

# Copies the newest finished EAS Android test build (APK) to a fixed link:
# https://github.com/Artyom-code-pi/softsoul-legal/releases/download/android-latest/SoftSoul.apk
# The join page (softsoul.app) links there. Runs every hour and can be run by hand.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check Expo token is set
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: Find newest finished Android build
        id: find
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # Ask Expo's API directly (no EAS CLI: this repo isn't the app project).
          QUERY='query($appId: String!) { app { byId(appId: $appId) { builds(offset: 0, limit: 10, filter: { platform: ANDROID, status: FINISHED }) { id appVersion appBuildVersion buildProfile artifacts { buildUrl applicationArchiveUrl } } } } }'
          BODY=$(jq -n --arg q "$QUERY" '{query: $q, variables: {appId: "bd5abbb6-a2e3-426f-8689-974ab9f8f79a"}}')
          curl -sS https://api.expo.dev/graphql \
            -H "Authorization: Bearer $EXPO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" > build.json || { echo "::error::Could not reach Expo API"; exit 1; }
          if jq -e '.errors' build.json >/dev/null; then
            echo "::error::Expo API error: $(jq -c '.errors' build.json | head -c 600)"
            exit 1
          fi
          # Newest APK build from the "preview" profile (the test build); else newest with a URL.
          PICK=$(jq -c '[.data.app.byId.builds[] | select((.artifacts.buildUrl // .artifacts.applicationArchiveUrl // "") | test("\\.apk$"))] as $apks
            | ([$apks[] | select(.buildProfile == "preview")][0] // $apks[0])' build.json)
          ID=$(echo "$PICK" | jq -r '.id // empty')
          URL=$(echo "$PICK" | jq -r '.artifacts.buildUrl // .artifacts.applicationArchiveUrl // empty')
          VER=$(echo "$PICK" | jq -r '.appVersion // ""')
          NUM=$(echo "$PICK" | jq -r '.appBuildVersion // ""')
          if [ -z "$ID" ] || [ -z "$URL" ]; then
            echo "::error::No finished Android APK build found. Builds seen: $(jq -c '[.data.app.byId.builds[] | {p: .buildProfile, u: (.artifacts.buildUrl // "")[-40:]}]' build.json | head -c 600)"
            exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "label=$VER ($NUM)" >> "$GITHUB_OUTPUT"
          echo "::notice::Newest Android build: $ID $VER ($NUM)"

      - name: Skip if already published
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT=$(gh release view android-latest -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -o 'EAS build: [a-f0-9-]*' | cut -d' ' -f3 || true)
          if [ "$CURRENT" = "${{ steps.find.outputs.id }}" ]; then
            echo "Already published ${{ steps.find.outputs.id }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        if: steps.check.outputs.skip != 'true'
        run: curl -fsSL "${{ steps.find.outputs.url }}" -o SoftSoul.apk && ls -lh SoftSoul.apk

      - name: Publish to fixed link
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="SoftSoul Android test build ${{ steps.find.outputs.label }}
          Updated $(date -u '+%d %b %Y %H:%M UTC').
          EAS build: ${{ steps.find.outputs.id }}"
          if gh release view android-latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit android-latest -R "$GITHUB_REPOSITORY" --notes "$NOTES" --title "Android beta ${{ steps.find.outputs.label }}"
          else
            gh release create android-latest -R "$GITHUB_REPOSITORY" --notes "$NOTES" --title "Android beta ${{ steps.find.outputs.label }}" --latest=false
          fi
          gh release upload android-latest SoftSoul.apk -R "$GITHUB_REPOSITORY" --clobber
